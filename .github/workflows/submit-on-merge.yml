name: submit community templates on merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: community-template-submit
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event.pull_request.merged == true &&
      github.repository == 'moewolf-dev/graphock' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Build community template submit payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changed = files.filter((file) => /^community\/templates\/[^/]+(?:\/|$)/.test(file.filename));
            const payload = {
              sourceRepo: 'https://github.com/' + context.repo.owner + '/' + context.repo.repo,
              sourcePrUrl: context.payload.pull_request.html_url,
              sourceCommitSha: context.payload.pull_request.merge_commit_sha,
              sourceMergedAt: context.payload.pull_request.merged_at,
              authorGithub: context.payload.pull_request.user.login,
              files: changed.map((file) => ({
                filename: file.filename,
                status: file.status,
              })),
            };
            require('fs').writeFileSync('/tmp/community-template-changed-files.json', JSON.stringify(payload, null, 2));
            core.setOutput('count', String(changed.length));
      - name: Generate community template submit payload
        if: steps.payload.outputs.count != '0'
        run: |
          node scripts/build-community-submit-payload.mjs \
            /tmp/community-template-changed-files.json \
            /tmp/community-template-submit.json
      - name: Submit changed templates
        if: steps.payload.outputs.count != '0'
        env:
          COMMUNITY_TEMPLATE_SUBMIT_URL: ${{ vars.COMMUNITY_TEMPLATE_SUBMIT_URL }}
          COMMUNITY_TEMPLATE_SUBMIT_TOKEN: ${{ secrets.COMMUNITY_TEMPLATE_SUBMIT_TOKEN }}
        run: |
          test -n "$COMMUNITY_TEMPLATE_SUBMIT_URL"
          test -n "$COMMUNITY_TEMPLATE_SUBMIT_TOKEN"
          curl --fail-with-body \
            -X POST "$COMMUNITY_TEMPLATE_SUBMIT_URL" \
            -H "content-type: application/json" \
            -H "x-graphock-community-submit-token: $COMMUNITY_TEMPLATE_SUBMIT_TOKEN" \
            --data-binary @/tmp/community-template-submit.json
